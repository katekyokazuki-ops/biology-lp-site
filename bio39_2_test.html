</style>

    },
    {

      choices: [

    },
    {
      q: "Q7. 両生類の心室が1つで動脈血と静脈血がやや混合しても生存できる理由として、正しい組み合わせはどれか？",
      choices: [
        "恒温動物であり、酸素を大量に必要とするから",
        "皮膚呼吸という肺以外の酸素の取り込み経路で補えることと、変温動物で代謝率が低く必要な酸素量が少ないこと",

      explain: "両生類は皮膚呼吸によって肺以外でも酸素を取り込めること、そして変温動物のため代謝率が低く必要とする酸素量が少ないことの2点で、混合血の非効率さを補っています。両生類の循環系は『妥協案』と表現できます。なお爬虫類も恒温ではなく変温動物なので、『恒温=鳥類・哺乳類のみ』と整理しておきましょう。"
    },
    {
      q: "Q8. 収斂進化に関する記述として、正しいものはどれか？",
      choices: [
        "共通祖先から受け継いだ形質が、環境に合わせて異なる形に分化する現象である",

      ],
      correct: 1,
      explain: "収斂進化は、異なる系統の生物が同じ課題に独立して類似の形質を進化させる現象です(例：翼・カメラ眼・魚形・閉鎖血管系)。答案では『同じ機能へ独立に』と説明するだけでなく、『収斂進化(収束進化)』という用語を明記します。コウモリの翼と昆虫の翅は由来が違う相似器官、ヒトの腕とコウモリの翼は由来が同じ相同器官です。進化に優劣はなく、あるのは適応だけです。"
    },
    {
      q: "Q9. 総合演習1で、凝固第Ⅹ因子欠損マウスの細菌排除能が低下した理由として、正しい因果の流れはどれか？",
      choices: [
        "Ⅹ因子欠損→フィブリン網が形成されない→好中球が切創部に集まらない(さらに止血不成立で細菌も侵入しやすい)→細菌排除能が低下する",

        "Ⅹ因子欠損→血ぺいが過剰に形成される→好中球が通れなくなる→排除能が低下する",
        "Ⅹ因子欠損と細菌排除能には何の関係もない"
      ],
      correct: 0,
      explain: "Ⅹ因子はプロトロンビンをトロンビンに変える反応の中心酵素なので、欠損するとフィブリン網も血ぺいも形成されません。追加情報にある『フィブリンは好中球の走化性因子』が働かないため好中球が集まらず、止血も不成立で細菌の血中侵入も許すため、細菌排除能が低下します。追加情報(走化性)を答案に入れ忘れると大幅減点です。"

      choices: [
        "T細胞は胸腺で産生され、骨髄では成熟だけが行われる",
        "T細胞は骨髄の造血幹細胞から産生されるが、機能的な成熟には胸腺が必要であり、B細胞は骨髄で成熟するため胸腺がなくても回復する",
        "B細胞も胸腺で成熟するため、B細胞も回復しない",
        "赤血球と血小板も胸腺で成熟するため、すべて回復しない"
      ],
      correct: 1,
      explain: "T細胞は骨髄の造血幹細胞から作られますが、自己反応性の除去などの選択を経て成熟するのは胸腺です。そのため胸腺がないとT細胞だけが回復しません。B細胞は骨髄で成熟する(Bone marrowのB)ので胸腺が不要で、赤血球・血小板も同様に回復します。『骨髄で産生→胸腺で成熟』の2段階を臓器名入りで書くことが重要です。"

    },

      q: "Q12. ヒトが激しい運動で心拍数と1回拍出量を増やせるのは閉鎖血管系だからこそ、とされる理由として正しいものはどれか？",

        "閉鎖血管系では血液を血管内に閉じ込めて心臓のポンプで加圧でき、血圧・血流量を即座に上げて末梢まで大量の血液を届けられるが、開放血管系では体腔に放出された血液を再加圧できず、この応答は不可能だから",

  ];

  let current = 0;
  let score = 0;
  const answers = [];
  const root = document.getElementById('quiz-root');

  function render(){
    if (current >= questions.length){
      renderResult();
      return;
    }
    const q = questions[current];
    const pct = Math.round((current/questions.length)*100);
    root.innerHTML = `
      <div class="qz-header">
        <h1>高校生物#39後編 確認テスト「臨床への橋渡し+総合演習」</h1>
        <p>全${questions.length}問 ／ シリーズ完結、最後の力試しです</p>
      </div>
      <div class="qz-progress-wrap"><div class="qz-progress-bar" style="width:${pct}%"></div></div>
      <div class="qz-body">
        <div class="qz-qcount">問題 ${current+1} / ${questions.length}</div>
        <div class="qz-question">${q.q}</div>
        <div class="qz-choices">
          ${q.choices.map((c,i)=>`<button class="qz-choice" data-i="${i}">${c}</button>`).join('')}
        </div>
        <div class="qz-explain" id="qz-explain"></div>
        <button class="qz-nextbtn" id="qz-next">${current === questions.length-1 ? '結果を見る' : '次の問題へ'}</button>
      </div>
    `;
    const buttons = root.querySelectorAll('.qz-choice');
    buttons.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.getAttribute('data-i'));
        buttons.forEach(b=>b.disabled = true);
        const isCorrect = i === q.correct;
        if (isCorrect){ score++; btn.classList.add('correct'); }
        else {
          btn.classList.add('wrong');
          buttons[q.correct].classList.add('correct');
        }
        answers.push({q: q.q, chosen: q.choices[i], correctAns: q.choices[q.correct], isCorrect});
        const ex = document.getElementById('qz-explain');
        ex.textContent = q.explain;
        ex.classList.add('show');
        document.getElementById('qz-next').classList.add('show');
      });
    });
    document.getElementById('qz-next').addEventListener('click', ()=>{
      current++;
      render();
    });
  }

  function renderResult(){
    const total = questions.length;
    const rate = Math.round((score/total)*100);
    let msg = "";
    if (rate === 100) msg = "全問正解！「体液と血液のすべて」シリーズを完璧に理解できています。本当にお疲れ様でした！";
    else if (rate >= 75) msg = "よく理解できています。間違えた問題だけ台本を見返して仕上げましょう。シリーズ完走まであと一息です。";
    else if (rate >= 50) msg = "基礎は掴めています。特に二重循環と2心房2心室の区別、総合演習の実験考察の型は要復習です。";
    else msg = "まだ不安でも心配無用！動画をもう一度見返して、まずはTHEME4のまとめ5行から復習しましょう。";

    root.innerHTML = `
      <div class="qz-header">
        <h1>高校生物#39後編 確認テスト「臨床への橋渡し+総合演習」</h1>
        <p>結果発表</p>
      </div>
      <div class="qz-body">
        <div class="qz-result">
          <div class="score">${score} <span>/ ${total}問正解（${rate}%）</span></div>
          <div class="msg">${msg}</div>
          <button class="qz-retry" id="qz-retry">もう一度挑戦する</button>
        </div>
        <div style="margin-top:22px;">
          <div style="font-weight:700; font-size:13px; color:var(--navy); margin-bottom:8px;">▼ 復習リスト</div>
          ${answers.map(a=>`
            <div class="qz-review-item ${a.isCorrect ? 'ok' : 'ng'}">
              <b>${a.isCorrect ? '○' : '×'}</b> ${a.q}<br>
              ${a.isCorrect ? '' : `あなたの回答：${a.chosen}<br>正解：${a.correctAns}<br>`}
            </div>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('qz-retry').addEventListener('click', ()=>{
      current = 0; score = 0; answers.length = 0;
      render();
    });
  }

  render();
})();
</script>
